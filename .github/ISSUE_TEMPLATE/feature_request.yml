name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, e.g. "Every week I need to ... and it takes ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like odoobuddy to do?
      placeholder: odoobuddy shop ... should ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
