[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "odoobuddy"
dynamic = ["version"]
description = "Install and manage multiple Odoo instances (any version, Community or Enterprise) on your computer or on production servers, with Nginx, SSL and IDE setup."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "niyasraphy", email = "niyasraphyk@gmail.com" }]
keywords = ["odoo", "installer", "erp", "deployment", "nginx", "letsencrypt", "devops", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Odoo",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "questionary>=2.0",
    "uv>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "build>=1.2", "twine>=5"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
odoobuddy = "odoobuddy.cli:run"

[project.urls]
Homepage = "https://github.com/niyasraphy/odoobuddy"
Documentation = "https://niyasraphy.github.io/odoobuddy/"
Issues = "https://github.com/niyasraphy/odoobuddy/issues"

[tool.hatch.version]
path = "src/odoobuddy/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=odoobuddy --cov-report=term-missing"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",  # typer.Option() in defaults is how typer works
    "UP045", # Optional[...] is required by typer on Python 3.10
    "UP007",
]

[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
files = ["src"]
strict = true
ignore_missing_imports = true
